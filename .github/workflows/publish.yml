# Neudata · publish the course website to GitHub Pages
# Settings → Pages → Source: GitHub Actions
# Code results come from the committed _freeze/ folder, so R is not needed here.
# Only the PARTICIPANT site is published; solutions (instructor profile) never are.
name: Publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render participant site
        run: quarto render
      - name: Make sure no solutions are published
        run: |
          if grep -rl 'class="solution' _site; then
            echo "::error::Solutions found in the participant site"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
